<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#0b9f45"><title>All2Go</title><style>
body{margin:0;background:#f5f8f6;font-family:Arial;color:#123027}.app{max-width:520px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px;position:sticky;top:0;background:#fff;border-bottom:1px solid #eee}.logo{font-size:28px;font-weight:900}.logo span{color:#0b9f45}.sub{font-size:11px;color:#718078}.search{margin-top:12px;background:#f0f4f1;padding:12px;border-radius:14px}.search input{border:0;outline:0;background:none;width:90%}main{padding:18px 18px 90px}.hero{padding:20px;border-radius:20px;background:#e8f8ed}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.cat{padding:12px 2px;border:1px solid #e6ece8;border-radius:14px;background:#fff}.cat b{display:block;font-size:22px}.product{display:flex;align-items:center;gap:12px;border:1px solid #e6ece8;border-radius:15px;padding:12px;margin:9px 0}.grow{flex:1}.emoji{font-size:32px}.btn{background:#0b9f45;color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #eee;padding:10px}.nav button{border:0;background:#fff;color:#68756e}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin:6px 0}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.sheet{background:#fff;width:min(520px,100%);margin:auto;padding:20px;border-radius:22px 22px 0 0}.msg{background:#fff4d0;padding:11px;border-radius:10px;font-size:12px;margin:8px 0}
</style></head><body><div class=app><div class=top><div class=logo>🛍️ All<span>2</span>Go</div><div class=sub>Everything you need. One app.</div><div class=search>🔎 <input id=q placeholder="Search food, groceries, shops..." oninput=home()></div></div><main id=main></main><div class=nav><button onclick=home()>🏠<br>Home</button><button onclick=orders()>📦<br>Orders</button><button onclick=account()>👤<br>Account</button><button onclick=cart()>🛒<br>Cart <b id=n>0</b></button></div></div><div id=modal class=modal><div id=sheet class=sheet></div></div><script>
let stores=[],basket=[],token=localStorage.token||"",user=JSON.parse(localStorage.user||"null");
const money=x=>"R"+x.toFixed(2);async function api(u,o={}){o.headers={...(o.headers||{}),"content-type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j}
async function home(){try{stores=await api("/api/marketplace")}catch(e){main.innerHTML="<div class=msg>"+e.message+"</div>";return}let q=(document.getElementById("q").value||"").toLowerCase();let h='<div class=hero><h1>Everything you need.<br><span style="color:#0b9f45">One app.</span></h1><p>Shop from local businesses in one place.</p></div><div class=cats><div class=cat>🍔<b>Food</b></div><div class=cat>🛒<b>Groceries</b></div><div class=cat>💊<b>Pharmacy</b></div><div class=cat>🛍️<b>Shopping</b></div></div>';stores.forEach(s=>{let ps=s.products.filter(p=>!q||p.name.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));if(ps.length)h+=`<h3>${s.name} <small>${s.category}</small></h3>`+ps.map(p=>`<div class=product><div class=emoji>🛍️</div><div class=grow><b>${p.name}</b><br>${money(p.price)}</div><button class=btn onclick='add(${s.id},${p.id},"${p.name.replace(/"/g,"&quot;")}",${p.price})'>Add</button></div>`).join("")});main.innerHTML=h||"<div class=msg>No results.</div>"}
function add(m,p,name,price){basket.push({merchant_id:m,product_id:p,name,price});document.getElementById("n").textContent=basket.length}
function cart(){if(!basket.length)return open("<h2>🛒 Cart</h2><p>Your cart is empty.</p>");let t=basket.reduce((a,x)=>a+x.price,0);open(`<h2>🛒 Cart</h2>${basket.map(x=>`<p>${x.name} — ${money(x.price)}</p>`).join("")}<hr><b>Total ${money(t)}</b><input id=addr class=field placeholder="Delivery address"><button class=btn style="width:100%" onclick=checkout()>Place order</button>`)}
async function checkout(){if(!token)return account();let a=document.getElementById("addr").value;if(!a)return alert("Enter delivery address");let m=basket[0].merchant_id;if(basket.some(x=>x.merchant_id!==m))return alert("One store per order for now.");try{let x=await api("/api/orders",{method:"POST",body:JSON.stringify({merchant_id:m,items:basket.map(x=>({product_id:x.product_id,quantity:1})),delivery_address:a})});basket=[];document.getElementById("n").textContent=0;open(`<h2>Order #${x.order.id}</h2><p>Ready for payment.</p><button class=btn onclick=payfast(${x.order.id})>Pay with Payfast</button>`)}catch(e){alert(e.message)}}
async function payfast(id){try{let x=await api("/api/orders/"+id+"/payfast",{method:"POST"});let f=document.createElement("form");f.method="POST";f.action=x.action;for(let[k,v]of Object.entries(x.fields)){let i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;f.appendChild(i)}document.body.appendChild(f);f.submit()}catch(e){alert(e.message)}}
async function orders(){if(!token)return account();try{let os=await api("/api/orders");main.innerHTML="<h2>Your orders</h2>"+(os.length?os.map(o=>`<div class=product><div class=grow><b>Order #${o.id}</b><br>${o.merchant}<br>R${(o.total_cents/100).toFixed(2)}<br>${o.status} • ${o.payment_status}</div></div>`).join(""):"<p>No orders yet.</p>")}catch(e){alert(e.message)}}
function account(){open(token?`<h2>👤 ${user.name}</h2><p>${user.email}</p><button class=btn onclick=logout()>Log out</button>`:`<h2>👤 Account</h2><input id=nm class=field placeholder="Name"><input id=em class=field placeholder="Email"><input id=pw class=field type=password placeholder="Password (8+ chars)"><button class=btn onclick=signup()>Create account</button><button class=btn style="background:#333;margin-left:5px" onclick=login()>Login</button>`)}
async function signup(){try{let x=await api("/api/register",{method:"POST",body:JSON.stringify({name:nm.value,email:em.value,password:pw.value})});token=x.token;user=x.user;localStorage.token=token;localStorage.user=JSON.stringify(user);close();home()}catch(e){alert(e.message)}}
async function login(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:em.value,password:pw.value})});token=x.token;user=x.user;localStorage.token=token;localStorage.user=JSON.stringify(user);close();home()}catch(e){alert(e.message)}}
function logout(){localStorage.clear();token="";user=null;close();home()}function open(x){sheet.innerHTML=x;modal.style.display="flex"}function close(){modal.style.display="none"}home();
</script></body></html>
